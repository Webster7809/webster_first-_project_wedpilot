# Wedpilot — full stack: MySQL, schema migration, API, and the Flutter web build.
#
#   cp .env.docker.example .env
#   # fill in the values, then:
#   docker compose up --build
#
# Every value below comes from that .env file. Nothing has an inline default
# that would let the stack come up half-configured — the backend's own startup
# gate (backend/config/requireEnv.js) refuses to start on a placeholder anyway,
# so a missing value surfaces here as a clear failure rather than a running
# server with broken email.

services:
  # ── Database ────────────────────────────────────────────────────────────────
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?set DB_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${DB_NAME:?set DB_NAME in .env}
      MYSQL_USER: ${DB_USER:?set DB_USER in .env}
      MYSQL_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    volumes:
      - db_data:/var/lib/mysql
    # Not published to the host by default. The API reaches it over the
    # compose network by service name; exposing 3306 publicly is how a
    # database ends up on the internet with a password as its only defence.
    # Uncomment for local inspection with a GUI client:
    # ports:
    #   - "127.0.0.1:3306:3306"
    healthcheck:
      # Authenticates as the real application user rather than pinging the
      # port: mysqld accepts connections for some seconds before it will
      # actually serve this database, and migrate would race that window.
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "${DB_USER}", "-p${DB_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  # ── Schema migration ────────────────────────────────────────────────────────
  # A one-shot job, not a step inside the API's own startup. Two API replicas
  # booting together would otherwise race each other through the same DDL.
  # Migrations are written to be idempotent (see backend/db/migrate.js), so
  # re-running this on every `up` is a no-op once the schema is current.
  migrate:
    build:
      context: ./backend
    restart: "no"
    command: ["node", "db/migrate.js"]
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
    depends_on:
      db:
        condition: service_healthy

  # ── API ─────────────────────────────────────────────────────────────────────
  api:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3000
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env (openssl rand -base64 32)}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      CORS_ORIGINS: ${CORS_ORIGINS:?set CORS_ORIGINS in .env}
      PUBLIC_WEB_BASE_URL: ${PUBLIC_WEB_BASE_URL:?set PUBLIC_WEB_BASE_URL in .env}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_FROM: ${SMTP_FROM:-Wedpilot <no-reply@wedpilot.app>}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
    volumes:
      # User uploads are written to the container filesystem, which is
      # discarded on every redeploy. This is the only application state living
      # outside MySQL, so it needs a volume to survive one.
      - uploads:/app/uploads
    ports:
      - "${API_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        # Start only once the schema is actually current — a successful exit,
        # not merely a started container.
        condition: service_completed_successfully

  # ── Flutter web ─────────────────────────────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        # Compile-time, not runtime: ApiConfig resolves these through
        # String.fromEnvironment, so they are baked into the JS bundle. Change
        # either one and the image must be rebuilt, not just restarted.
        API_BASE_URL: ${API_BASE_URL:?set API_BASE_URL in .env — the public https origin of the API}
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      - api

volumes:
  db_data:
  uploads:
