name: wed_plan_pilot
description: "Wedpilot - AI-powered cross-platform wedding planning application"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^14.6.2

  # HTTP & networking
  dio: ^5.7.0
  web_socket_channel: ^3.0.1
  connectivity_plus: ^6.1.3

  # Local storage
  flutter_secure_storage: ^9.2.2
  hive_flutter: ^1.1.0

  # Images
  cached_network_image: ^3.4.1
  image_picker: ^1.1.2

  # Charts
  fl_chart: ^0.69.0

  # Animations
  flutter_animate: ^4.5.0
  lottie: ^3.1.3
  confetti: ^0.7.0

  # Fonts
  google_fonts: ^6.2.1

  # Utilities
  intl: ^0.20.2
  uuid: ^4.5.1
  equatable: ^2.0.7

  # Sharing
  share_plus: ^10.1.2
  url_launcher: ^6.3.1

  # Google Sign-In
  google_sign_in: ^7.2.0

  # QR Code
  qr_flutter: ^4.1.0

  # SVG
  flutter_svg: ^2.0.10+1

  # Notifications
  flutter_local_notifications: ^18.0.1

  # Calendar
  table_calendar: ^3.1.2

  # PDF & printing
  pdf: ^3.11.1
  printing: ^5.13.2

  # File picker
  file_picker: ^8.1.4

  # Shimmer loading effect
  shimmer: ^3.0.0

  # Progress indicators
  percent_indicator: ^4.2.3

  # Badges
  badges: ^3.1.2

  # Timeline
  timeline_tile: ^2.0.0

  # Pin / OTP input
  pin_code_fields: ^8.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.6

flutter:
  uses-material-design: true

  # Bundled rather than fetched at runtime by google_fonts: a first launch on a
  # poor connection would otherwise fall back to Roboto silently, which is the
  # exact failure this replaces. google_fonts stays a dependency only for the
  # user-selectable invitation template faces.
  fonts:
    - family: Playfair Display
      fonts:
        - asset: assets/fonts/PlayfairDisplay-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlayfairDisplay-Bold.ttf
          weight: 700
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700

# Ring logo artwork — rerun after changing assets/icon/*.png:
# dart run flutter_launcher_icons && dart run flutter_native_splash:create
flutter_launcher_icons:
  android: true
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  web:
    generate: true
    image_path: "assets/icon/icon.png"
    background_color: "#FFFFFF"
    theme_color: "#163D2C"

flutter_native_splash:
  color: "#FAF9FC"
  image: assets/icon/splash_logo_light.png
  color_dark: "#111318"
  image_dark: assets/icon/icon_foreground.png
  android_12:
    image: assets/icon/splash_logo_light.png
    icon_background_color: "#FAF9FC"
    image_dark: assets/icon/icon_foreground.png
    icon_background_color_dark: "#111318"
