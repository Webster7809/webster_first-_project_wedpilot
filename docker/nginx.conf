server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Flutter web ships large .js and .wasm payloads that compress extremely
    # well — the main.dart.js bundle is typically 3-5x smaller gzipped.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/wasm
        image/svg+xml
        font/ttf
        font/woff2;

    # TLS is terminated by whatever sits in front of this container (load
    # balancer, ingress, Cloudflare), so HSTS is set there, not here — sending
    # it from a container reachable over plain http would pin the wrong scheme.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Fingerprinted assets: the filename changes whenever the content does, so
    # they can be cached indefinitely.
    location ~* \.(?:js|css|wasm|woff2?|ttf|otf|png|jpe?g|gif|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # None of these are fingerprinted — `flutter build web` ships them under
    # the same filename on every build — and they're what the browser
    # consults to discover a new build. Cached, a returning visitor keeps
    # loading the previous release indefinitely: main.dart.js is the actual
    # app code, so this is the "stuck on the old version after deploy"
    # failure, not just a hypothetical one. `location =` exact matches take
    # priority over the regex block below regardless of file order, so these
    # override it for just these entry-point files.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }
    location = /main.dart.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }
    location = /flutter.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }
    location = /flutter_bootstrap.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }
    location = /flutter_service_worker.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }
    location = /version.json {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    # Single-page fallback. The app routes on the fragment (`/#/verify-email`),
    # which the browser never sends to the server, so most requests already
    # arrive as "/". This covers a deep link or refresh on a path-form route
    # (e.g. the public invitation view) reaching nginx directly, which would
    # otherwise 404 on a path that only exists inside the Dart router.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
